name: Build & Release

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'android/build.gradle'
      - 'android/app/build.gradle'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      is_release:
        description: '是否发布 Release'
        required: true
        type: boolean
        default: true
      force_tag:
        description: '强制版本号（可选）'
        required: false
        type: string

jobs:
  # ============================================
  # Job 1: 环境准备
  # ============================================
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      package_code: ${{ steps.version.outputs.package_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true
      
      - name: Install Android SDK command line tools
        run: |
          sdkmanager --list > /dev/null 2>&1 || echo "SDK tools not available, will use existing"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Get version
        id: version
        run: |
          PACKAGE_VERSION=$(node -p -e 'require("./package.json").version')
          PACKAGE_CODE=$(node -p -e 'require("./package.json").versionCode')
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "package_code=${PACKAGE_CODE}" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          echo "PACKAGE_CODE=${PACKAGE_CODE}" >> "$GITHUB_ENV"
      
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

  # ============================================
  # Job 2: 构建 Android APK
  # ============================================
  build-android:
    name: Build Android APK
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi:
          - 'arm64-v8a'
          - 'armeabi-v7a'
          - 'x86_64'
          - 'universal'
    outputs:
      apk_names: ${{ steps.artifacts.outputs.apk_names }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true
      
      - name: Install Android SDK command line tools
        run: |
          sdkmanager --list > /dev/null 2>&1 || echo "SDK tools not available, will use existing"
      
      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/build.gradle') }}
      
      - name: Install dependencies
        run: npm ci
      
      - name: Decrypt keystore
        env:
          MYAPP_KEYSTORE_BASE64: ${{ secrets.MYAPP_KEYSTORE_BASE64 }}
          MYAPP_UPLOAD_STORE_FILE: ${{ secrets.MYAPP_UPLOAD_STORE_FILE }}
        run: |
          cd android
          echo $MYAPP_KEYSTORE_BASE64 | base64 --decode > app/${MYAPP_UPLOAD_STORE_FILE}
          chmod +x ./gradlew
      
      - name: Convert PKCS12 to JKS
        env:
          MYAPP_UPLOAD_STORE_FILE: ${{ secrets.MYAPP_UPLOAD_STORE_FILE }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
        run: |
          cd android
          # 查看 PKCS12 的别名
          keytool -list -v -keystore app/${MYAPP_UPLOAD_STORE_FILE} -storetype PKCS12 -storepass ${MYAPP_UPLOAD_STORE_PASSWORD} 2>&1 | head -20 || echo "Failed to list keystore"
          
          # 转换为 JKS 格式
          keytool -importkeystore \
            -srckeystore app/${MYAPP_UPLOAD_STORE_FILE} \
            -srcstoretype PKCS12 \
            -srcstorepass ${MYAPP_UPLOAD_STORE_PASSWORD} \
            -destkeystore app/app-release.jks \
            -deststoretype JKS \
            -deststorepass ${MYAPP_UPLOAD_STORE_PASSWORD} \
            -destkeypass ${MYAPP_UPLOAD_KEY_PASSWORD} \
            -alias ${MYAPP_UPLOAD_KEY_ALIAS} \
            -noprompt || echo "Conversion failed, using PKCS12 directly"
          
          # 更新 store file 为 JKS
          echo "MYAPP_UPLOAD_STORE_FILE=app-release.jks" >> $GITHUB_ENV
      
      - name: Build Release APK
        env:
          MYAPP_UPLOAD_STORE_FILE: ${{ secrets.MYAPP_UPLOAD_STORE_FILE }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE='${{ env.MYAPP_UPLOAD_STORE_FILE }}' \
            -PMYAPP_UPLOAD_KEY_ALIAS='${{ env.MYAPP_UPLOAD_KEY_ALIAS }}' \
            -PMYAPP_UPLOAD_STORE_PASSWORD='${{ env.MYAPP_UPLOAD_STORE_PASSWORD }}' \
            -PMYAPP_UPLOAD_KEY_PASSWORD='${{ env.MYAPP_UPLOAD_KEY_PASSWORD }}'
      
      - name: Rename APK
        id: artifacts
        run: |
          APK_NAME="lx-music-v${PACKAGE_VERSION}-${{ matrix.abi }}.apk"
          cd android/app/build/outputs/apk/release
          # 查找实际的 APK 文件（分架构构建）
          if [ "${{ matrix.abi }}" = "universal" ]; then
            SRC_APK="app-release.apk"
          else
            SRC_APK="app-${{ matrix.abi }}-release.apk"
          fi
          echo "Looking for: $SRC_APK"
          ls -la *.apk
          if [ -f "$SRC_APK" ]; then
            mv "$SRC_APK" "${APK_NAME}"
          else
            # 尝试匹配第一个 APK
            FIRST_APK=$(ls *.apk | head -1)
            if [ -n "$FIRST_APK" ]; then
              mv "$FIRST_APK" "${APK_NAME}"
            else
              echo "No APK found!"
              exit 1
            fi
          fi
          echo "apk_names=${APK_NAME}" >> "$GITHUB_OUTPUT"
      
      - name: Generate MD5 & SHA256
        run: |
          cd android/app/build/outputs/apk/release
          md5sum *.apk > md5sums.txt
          sha256sum *.apk > sha256sums.txt
          echo "MD5 Checksums:"
          cat md5sums.txt
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.abi }}
          path: |
            android/app/build/outputs/apk/release/lx-music-v${PACKAGE_VERSION}-${{ matrix.abi }}.apk
            android/app/build/outputs/apk/release/md5sums.txt
            android/app/build/outputs/apk/release/sha256sums.txt
          retention-days: 30

  # ============================================
  # Job 3: 发布 GitHub Release
  # ============================================
  release:
    name: Create Release
    needs: [setup, build-android]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.is_release == true }}
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true
        continue-on-error: true
      
      - name: Debug artifacts
        run: |
          echo "Artifacts directory contents:"
          ls -laR ./artifacts
          echo ""
          echo "Looking for APK files:"
          find ./artifacts -name "*.apk" -type f
      
      - name: Generate release body
        run: |
          # 从 changelog 提取本次更新
          if [ -f "./publish/changeLog.md" ]; then
            awk 'BEGIN{RS="---"}{if(NR==1)print $0}' ./publish/changeLog.md > RELEASE_NOTES.md
          else
            echo "# 更新日志" > RELEASE_NOTES.md
          fi
          
          # 添加构建信息
          echo -e "\n## 构建信息" >> RELEASE_NOTES.md
          echo "- 版本: v${PACKAGE_VERSION} (${PACKAGE_CODE})" >> RELEASE_NOTES.md
          echo "- 构建时间: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> RELEASE_NOTES.md
          echo "- Commit: ${GITHUB_SHA}" >> RELEASE_NOTES.md
          echo "- 分支: ${GITHUB_REF_NAME}" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          
          # 查找所有 APK 文件
          APK_FILES=$(find ./artifacts -name "*.apk" -type f)
          if [ -z "$APK_FILES" ]; then
            echo "Warning: No APK files found in artifacts!"
            echo "Available files:"
            find ./artifacts -type f
          fi
          
          # 添加 MD5
          echo "## 文件校验" >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md
          if [ -n "$APK_FILES" ]; then
            echo "$APK_FILES" | while read -r apk; do
              echo "$(basename $apk): $(md5sum $apk | cut -d' ' -f1)" >> RELEASE_NOTES.md
            done
          else
            echo "No APK files found" >> RELEASE_NOTES.md
          fi
          echo '```' >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          
          # 添加安装说明
          echo "## 安装说明" >> RELEASE_NOTES.md
          echo "- **极氪 7X 用户**：使用极拓安装，推荐 arm64-v8a 版本" >> RELEASE_NOTES.md
          echo "- **普通安卓手机**：任意版本均可" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## 使用说明" >> RELEASE_NOTES.md
          echo "1. 安装后首次启动需要配置自定义音源" >> RELEASE_NOTES.md
          echo "2. 车机用户建议开启通知栏保活" >> RELEASE_NOTES.md
          echo "3. 支持方向盘控制播放" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
      
      - name: Resolve release tag
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="v${PACKAGE_VERSION}"
          
          if gh release view "${BASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            RELEASE_TAG="${BASE_TAG}-test.${GITHUB_RUN_NUMBER}"
            RELEASE_PRERELEASE="true"
          else
            RELEASE_TAG="${BASE_TAG}"
            RELEASE_PRERELEASE="false"
          fi
          
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_prerelease=${RELEASE_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_PRERELEASE=${RELEASE_PRERELEASE}" >> "$GITHUB_ENV"
      
      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists, skipping"
          else
            git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${PACKAGE_VERSION}"
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.tag.outputs.release_prerelease }}
          draft: false
          tag_name: ${{ steps.tag.outputs.release_tag }}
          files: |
            artifacts/lx-music-v${PACKAGE_VERSION}-arm64-v8a.apk
            artifacts/lx-music-v${PACKAGE_VERSION}-armeabi-v7a.apk
            artifacts/lx-music-v${PACKAGE_VERSION}-x86_64.apk
            artifacts/lx-music-v${PACKAGE_VERSION}-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Job 4: 通知
  # ============================================
  notify:
    name: Send Notification
    needs: [release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Log result
        run: |
          echo "Build Status: ${{ needs.release.result }}"
          echo "Version: v${{ needs.setup.outputs.package_version }}"
          echo "Release Tag: ${{ needs.release.outputs.release_tag }}"
          echo "Run ID: ${{ github.run_id }}"